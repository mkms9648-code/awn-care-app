name: awn_care
description: Awn Care — personal assistant for resident physicians in the hospital.
publish_to: 'none'
version: 1.3.1+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  postgrest: ^2.8.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5
  http: ^1.4.0
  record: ^6.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  share_plus: ^10.1.4
  gal: ^2.3.1
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

# إعداد flutter_launcher_icons — بيولّد كل أحجام أيقونة التطبيق (خارج التطبيق،
# لما يكون بين التطبيقات التانية على الموبايل) من نفس الصورة دي تلقائيًا.
# شغّل بعد ما الصورة تتحط: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
