<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>متابعة الحالة — تواصل مع المساعد الصحي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="assets/style.css?v=4" />
  <script src="config.js?v=4"></script>
</head>
<body>
  <!-- شاشة 1: إدخال كود الوصول -->
  <div id="gate-screen" class="gate-wrap">
    <div class="gate-card">
      <div class="gate-icon"><i class="ti ti-stethoscope"></i></div>
      <h1>متابعة حالتك <span class="brand-accent">بعد الزيارة</span></h1>
      <p class="muted">
        اكتب كود المتابعة اللي معاك (مكتوب على الروشتة أو اتبعت لك)، وهتلاقي
        نفسك في محادثة مع المساعد الصحي، عارف حالتك بالكامل.
      </p>

      <form id="code-form">
        <div class="field">
          <label for="code-input">كود المتابعة</label>
          <input
            type="text"
            id="code-input"
            placeholder="XXXX-XXXX-XX"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
            inputmode="text"
            maxlength="12"
            required
          />
        </div>
        <button type="submit" class="btn btn-block" id="code-submit-btn">دخول</button>
        <div class="error-msg" id="gate-error"></div>
      </form>
    </div>
  </div>

  <!-- شاشة 2: الشات -->
  <div id="chat-screen" class="chat-wrap" hidden>
    <header class="chat-header">
      <div class="chat-header-title" id="chat-greeting">أهلاً 👋</div>
      <div class="chat-header-sub">المساعد الصحي — متاح للرد على استفساراتك</div>
    </header>

    <div class="chat-messages" id="chat-messages">
      <p class="muted" style="padding: 16px;">جاري التحميل…</p>
    </div>

    <form class="chat-input-bar" id="send-form">
      <input
        type="text"
        id="message-input"
        placeholder="اكتب رسالتك هنا…"
        autocomplete="off"
        required
      />
      <button type="submit" class="send-btn" id="send-btn" aria-label="إرسال">
        <i class="ti ti-send-2"></i>
      </button>
    </form>
  </div>

  <script type="module" src="assets/portal.js?v=4"></script>
</body>
</html>
